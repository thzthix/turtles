[project]
name = "turtle-analyzer-agent"
version = "0.1.0"
description = "거북이 종류 및 암수 판별 AI 에이전트"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=0.0.24",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "T20",
    "RUF",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 실제 API 호출이 필요한 통합 테스트",
]
